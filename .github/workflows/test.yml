name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        # Every test file except the DB-backed integration ones. Uses a
        # glob-based exclude so newly-added unit test files are picked
        # up automatically.
        run: >
          uv run pytest tests/
          --ignore-glob='tests/test_integration_*.py'
          -v

  integration:
    name: integration (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests against Postgres
        env:
          YUGABYTEDB_URL: "host=localhost port=5432 dbname=test user=test password=test"
        # Glob picks up every tests/test_integration_*.py file so a new
        # integration file (e.g. test_integration_pool_reset.py) doesn't
        # silently sit outside CI.
        run: >
          uv run pytest tests/test_integration_*.py -v
